name: EVDS verilerini guncelle

on:
  schedule:
    - cron: "17 9 3,8,18,25 * *"
  workflow_dispatch:
    inputs:
      kesfet:
        description: "Yalniz seri kodlarini listele (degisiklik yapma)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Seri kodlarini listele
        if: ${{ inputs.kesfet }}
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python3 tools/evds_guncelle.py content.json --kesfet
      - name: Verileri cek ve content.json'u guncelle
        if: ${{ !inputs.kesfet }}
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python3 tools/evds_guncelle.py content.json
      - name: Degisiklik varsa kaydet
        if: ${{ !inputs.kesfet }}
        run: |
          if git diff --quiet content.json; then
            echo "Degisiklik yok"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content.json
            git commit -m "EVDS verileri guncellendi"
            git push
          fi
